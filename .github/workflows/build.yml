name: Build Webo (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  WEBO_VERSION: 0.2.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish src/Webo.App/Webo.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== DIAG 1: files under obj ==="
            Get-ChildItem -Path src/Webo.App/obj -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'json$|\.g\.|xaml' } | ForEach-Object { $_.FullName }
            $dir = Get-ChildItem -Path src/Webo.App/obj -Recurse -Filter input.json -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dir) {
              Write-Host "=== DIAG 2: running XamlCompiler manually ==="
              $xc = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk\1.5.240802000" -Recurse -Filter XamlCompiler.exe | Where-Object { $_.FullName -match 'net472' } | Select-Object -First 1
              $in = $dir.FullName; $out = Join-Path $dir.DirectoryName 'manual-output.json'
              Push-Location src/Webo.App
              $result = & $xc.FullName $in $out 2>&1
              Write-Host "exit code: $LASTEXITCODE"
              $result | ForEach-Object { Write-Host $_ }
              Pop-Location
              if (Test-Path $out) { Write-Host "=== DIAG 3: manual-output.json ==="; Get-Content $out -Raw }
            }
            exit 1
          }

      - name: Verify the publish output
        shell: pwsh
        run: |
          $must = @(
            'out/Webo.exe',
            'out/Assets/Brand/derived/icons/dark/webo-dark.ico',
            'out/Assets/Brand/derived/icons/dark/preview-256.png',
            'out/Assets/Brand/derived/icons/light/webo-light.ico',
            'out/Assets/Brand/derived/icons/mono/webo-mono.ico',
            'out/Assets/Fonts/IBMPlexSansArabic-Regular.ttf',
            'out/Assets/Fonts/IBMPlexSansArabic-Medium.ttf',
            'out/Assets/Fonts/IBMPlexSansArabic-SemiBold.ttf',
            'out/Assets/Fonts/IBMPlexSansArabic-Bold.ttf'
          )
          $missing = $must | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing from publish output: $($missing -join ', ')" }
          Get-ChildItem out | Measure-Object | Select-Object Count

      - name: Smoke test (the app must start and stay alive)
        continue-on-error: true   # informational: a headless runner may not host a WinUI window
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD/out/Webo.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Webo.exe exited early with code $($p.ExitCode)" }
          Write-Host "Webo.exe is still running after 12s (PID $($p.Id)); stopping it."
          Stop-Process -Id $p.Id -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:WEBO_VERSION" installer\webo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out\* -DestinationPath "dist/Webo-$env:WEBO_VERSION-portable-win-x64.zip" -Force
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Webo-${{ env.WEBO_VERSION }}-windows
          path: dist/*

      - name: Publish GitHub pre-release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
