name: Build Webo Icon Spike (Windows)
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: dotnet publish WeboIconSpike.csproj -c Release -r win-x64 -p:Platform=x64 -o out
      - name: Verify EXE and icons exist
        shell: pwsh
        run: |
          if (!(Test-Path out/WeboIconSpike.exe)) { throw "EXE missing" }
          if (!(Test-Path out/Assets/Brand/derived/icons/dark/webo-dark.ico)) { throw "icons missing" }
          Get-ChildItem out | Measure-Object
      - uses: actions/upload-artifact@v4
        with:
          name: WeboIconSpike-win-x64
          path: out
